name: Run all upstream Mike synchronizers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/upstream-sync-request.json

permissions:
  actions: write
  contents: read

concurrency:
  group: run-all-upstream-mike-synchronizers
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Start self-draining low-risk and escalation queues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "sync-upstream-mike.yml",
              ref: "main",
            });
            core.notice(
              "Started the low-risk Mike synchronizer. Each merged batch dispatches the next low-risk batch and the escalated queue; high-risk work stops at a draft PR for one readiness decision.",
            );
