name: ROSS release train

on:
  workflow_dispatch:
    inputs:
      promote_public:
        description: Request public application promotion (blocked until public beta has an independent backend)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ross-release-train
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify exact release source
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pinned Node.js and npm
        uses: ./.github/actions/setup-ross-node

      - name: Install locked dependencies
        run: npm run install:all

      - name: Run complete engineering gate
        run: npm run check

      - name: Observe live legal sources for production gate
        if: inputs.promote_public
        continue-on-error: true
        run: |
          mkdir -p artifacts
          node scripts/observe-legal-sources.mjs \
            --output artifacts/release-train-legal-source-health.json

      - name: Run production final-completion gate before public promotion
        if: inputs.promote_public
        run: npm run final:check -- --source-report artifacts/release-train-legal-source-health.json

      - name: Upload production qualification legal-source report
        if: always() && inputs.promote_public
        uses: actions/upload-artifact@v7
        with:
          name: ross-release-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-train-legal-source-health.json
          if-no-files-found: warn
          retention-days: 90

      - name: Build every Fly container path
        run: npm run preflight:fly

      - name: Confirm generated and governed files are committed
        run: git diff --exit-code

  release-train:
    name: Rehearse exact private application image digests
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: private-online
    permissions:
      contents: write
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      ROSS_SUPABASE_URL: ${{ secrets.ROSS_SUPABASE_URL }}
      ROSS_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.ROSS_SUPABASE_PUBLISHABLE_KEY }}
      ROSS_SUPABASE_SECRET_KEY: ${{ secrets.ROSS_SUPABASE_SECRET_KEY }}
      ROSS_S3_ENDPOINT_URL: ${{ secrets.ROSS_S3_ENDPOINT_URL }}
      ROSS_S3_REGION: ${{ secrets.ROSS_S3_REGION }}
      ROSS_S3_ACCESS_KEY_ID: ${{ secrets.ROSS_S3_ACCESS_KEY_ID }}
      ROSS_S3_SECRET_ACCESS_KEY: ${{ secrets.ROSS_S3_SECRET_ACCESS_KEY }}
      ROSS_SECURITY_ALERT_WEBHOOK_URL: ${{ secrets.ROSS_SECURITY_ALERT_WEBHOOK_URL }}
      ROSS_SECURITY_ALERT_WEBHOOK_SECRET: ${{ secrets.ROSS_SECURITY_ALERT_WEBHOOK_SECRET }}
      FLY_ORG: personal
      PROD_API_APP: ross-ranadeoss-api
      PROD_WEB_APP: ross-ranadeoss-public
      PROD_WORKER_APP: ross-ranadeoss-file-worker
      STAGE_API_APP: ross-ranadeoss-api-rehearsal
      STAGE_WEB_APP: ross-ranadeoss-web-rehearsal
      STAGE_WORKER_APP: ross-ranadeoss-worker-rehearsal
      PUBLIC_WEBSITE_URL: https://ross-ontario.augustmaat.chatgpt.site
      POLICY_VERSION: 2026-07-17-public-beta
      ROSS_QUALIFICATION_STATUS: passed
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact qualified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up pinned Node.js and npm
        uses: ./.github/actions/setup-ross-node

      - name: Set up pinned Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.49

      - name: Reject unsupported public application promotion
        if: inputs.promote_public
        shell: bash
        run: |
          echo "Public beta has no independent Supabase-backed application deployment. Publish the public website through its dedicated hosting path; use Deploy private ROSS for the private application." >&2
          exit 1

      - name: Validate existing protected secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            FLY_API_TOKEN \
            ROSS_SUPABASE_URL \
            ROSS_SUPABASE_PUBLISHABLE_KEY \
            ROSS_SUPABASE_SECRET_KEY \
            ROSS_S3_ENDPOINT_URL \
            ROSS_S3_REGION \
            ROSS_S3_ACCESS_KEY_ID \
            ROSS_S3_SECRET_ACCESS_KEY \
            ROSS_SECURITY_ALERT_WEBHOOK_URL \
            ROSS_SECURITY_ALERT_WEBHOOK_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "Required private-online rehearsal secret is missing: ${name}" >&2
              exit 1
            fi
          done
          flyctl auth whoami >/dev/null
          SUPABASE_BASE="${ROSS_SUPABASE_URL%/}"
          for key_name in \
            ROSS_SUPABASE_PUBLISHABLE_KEY \
            ROSS_SUPABASE_SECRET_KEY; do
            if ! curl --fail --silent --show-error --output /dev/null \
              "${SUPABASE_BASE}/auth/v1/settings" \
              -H "apikey: ${!key_name}"; then
              echo "${key_name} does not authenticate against ROSS_SUPABASE_URL." >&2
              exit 1
            fi
          done

      - name: Generate the next unused public release ID
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          release_id="$(node scripts/release-train-image-ref.mjs next-id)"
          node scripts/validate-release-id.mjs "$release_id"
          echo "ROSS_RELEASE_ID=${release_id}" >> "$GITHUB_ENV"
          echo "Generated candidate release ID: ${release_id}"

      - name: Build and pin candidate images once
        run: bash scripts/build-release-train-images.sh

      - name: Run non-production promotion and rollback rehearsal
        run: node scripts/fly-release-train.mjs rehearse

      - name: Preflight the final release record without writing it
        if: inputs.promote_public
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse --verify --quiet "refs/tags/${ROSS_RELEASE_ID}" >/dev/null; then
            echo "Generated release tag unexpectedly already exists." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$ROSS_RELEASE_ID" -m "ROSS public beta release train preflight"
          trap 'git tag --delete "$ROSS_RELEASE_ID" >/dev/null 2>&1 || true' EXIT
          git push --dry-run origin "refs/tags/${ROSS_RELEASE_ID}"

      - name: Promote the rehearsed digests to public production
        if: inputs.promote_public
        run: node scripts/fly-release-train.mjs promote

      - name: Create immutable tag and GitHub release after public success
        if: inputs.promote_public && success()
        shell: bash
        run: |
          set -euo pipefail
          rollback_on_finalization_error() {
            status="$?"
            trap - ERR
            echo "Release record finalization failed; restoring all prior production images." >&2
            node scripts/fly-release-train.mjs restore || \
              echo "Automatic production restoration also failed; review the release ledger immediately." >&2
            exit "$status"
          }
          trap rollback_on_finalization_error ERR
          if git rev-parse --verify --quiet "refs/tags/${ROSS_RELEASE_ID}" >/dev/null; then
            echo "Generated release tag unexpectedly already exists." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$ROSS_RELEASE_ID" -m "ROSS public beta release train"
          for attempt in 1 2 3 4 5; do
            if git push origin "refs/tags/${ROSS_RELEASE_ID}"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
          for attempt in 1 2 3 4 5; do
            if gh release create "$ROSS_RELEASE_ID" \
              --verify-tag \
              --title "$ROSS_RELEASE_ID" \
              --notes "Qualified, rehearsed, promoted by immutable image digest, and health-checked. See the attached release ledger." \
              artifacts/release-train-ledger.json; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
          trap - ERR

      - name: Upload release ledger and build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ross-release-train-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/release-train-ledger.json
            artifacts/release-train-legal-source-health.json
            artifacts/release-train-build/*.log
            reports/final-completion-dossier.md
            reports/ontario-evaluation-v1.json
            reports/legal-source-health-v1.json
            reports/backup-restore-exercise-2026-07-18.json
            reports/release-manifest-v1.json
            config/final-completion.v1.json
            config/professional-validation.v1.json
            config/release-approvals.v1.json
            config/operations-readiness.v1.json
            config/launch-readiness.v1.json
            docs/release-evidence/effective-notices-owner-approval-2026-07-18.md
          if-no-files-found: warn
          retention-days: 90

      - name: Publish operator summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ROSS release train"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Candidate release ID: ${ROSS_RELEASE_ID}"
            echo "- Public promotion requested: ${{ inputs.promote_public }}"
            if [ -f artifacts/release-train-ledger.json ]; then
              echo "- Rehearsal: $(jq -r '.rehearsal.status // "not-run"' artifacts/release-train-ledger.json)"
              echo "- Forced failure observed: $(jq -r '.rehearsal.expectedFailureObserved // false' artifacts/release-train-ledger.json)"
              echo "- Rollback verified: $(jq -r '.rehearsal.rollbackVerified // false' artifacts/release-train-ledger.json)"
              echo "- Candidate staging promotion: $(jq -r '.rehearsal.candidatePromotionVerified // false' artifacts/release-train-ledger.json)"
              echo "- Read-only integration checks: $(jq -r '.rehearsal.readOnlyIntegrationChecks // "not-run"' artifacts/release-train-ledger.json)"
              echo "- Legal sources: $(jq -r '.rehearsal.legalSourceObservation // "not-run"' artifacts/release-train-ledger.json)"
              echo "- Production: $(jq -r '.production.status // "not-requested"' artifacts/release-train-ledger.json)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
